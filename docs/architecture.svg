<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Building Ops Copilot architecture</title>
  <desc id="d">Browser talks to an Express server over SSE; the server runs an agent loop that calls Claude and policy-gated tools over a swappable telemetry repository.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <style>
      .bg{fill:#070d14}.box{fill:#0b141e;stroke:#1f3a4d;stroke-width:1.2}
      .hot{fill:#0b141e;stroke:#22d3ee;stroke-width:1.6}
      .t{font:600 14px ui-monospace,Consolas,monospace;fill:#e6f1f7}
      .s{font:12px ui-monospace,Consolas,monospace;fill:#7f9bb0}
      .l{stroke:#22d3ee;stroke-width:1.5;fill:none}
      .d{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect class="bg" width="960" height="420" rx="6"/>

  <rect class="box" x="30" y="150" width="170" height="110" rx="3"/>
  <text class="t" x="115" y="188" text-anchor="middle">Browser</text>
  <text class="s" x="115" y="210" text-anchor="middle">HUD console</text>
  <text class="s" x="115" y="228" text-anchor="middle">twin · charts · Ctrl+K</text>

  <rect class="box" x="260" y="150" width="170" height="110" rx="3"/>
  <text class="t" x="345" y="188" text-anchor="middle">Express server</text>
  <text class="s" x="345" y="210" text-anchor="middle">SSE stream</text>
  <text class="s" x="345" y="228" text-anchor="middle">sessions · helmet · CSP</text>

  <rect class="hot" x="490" y="120" width="190" height="170" rx="3"/>
  <text class="t" x="585" y="152" text-anchor="middle">Agent loop</text>
  <text class="s" x="585" y="176" text-anchor="middle">stop_reason driven</text>
  <text class="s" x="585" y="194" text-anchor="middle">parallel tool calls</text>
  <text class="s" x="585" y="212" text-anchor="middle">abort + iteration cap</text>
  <text class="s" x="585" y="230" text-anchor="middle">validate → policy →</text>
  <text class="s" x="585" y="248" text-anchor="middle">approval → run</text>

  <rect class="box" x="740" y="40" width="190" height="90" rx="3"/>
  <text class="t" x="835" y="76" text-anchor="middle">LlmClient</text>
  <text class="s" x="835" y="98" text-anchor="middle">Claude Messages API</text>
  <text class="s" x="835" y="114" text-anchor="middle">or scripted demo model</text>

  <rect class="box" x="740" y="165" width="190" height="80" rx="3"/>
  <text class="t" x="835" y="200" text-anchor="middle">Tool registry</text>
  <text class="s" x="835" y="222" text-anchor="middle">zod schema = JSON schema</text>

  <rect class="box" x="740" y="290" width="190" height="90" rx="3"/>
  <text class="t" x="835" y="326" text-anchor="middle">TelemetryRepository</text>
  <text class="s" x="835" y="348" text-anchor="middle">in-memory today</text>
  <text class="s" x="835" y="364" text-anchor="middle">TimescaleDB next</text>

  <rect class="box" x="490" y="320" width="190" height="60" rx="3"/>
  <text class="t" x="585" y="346" text-anchor="middle">Approval broker</text>
  <text class="s" x="585" y="364" text-anchor="middle">human confirms critical writes</text>

  <path class="l" d="M200 205H260" marker-end="url(#a)"/>
  <path class="l" d="M430 205H490" marker-end="url(#a)"/>
  <path class="l" d="M680 150C710 150 710 85 740 85" marker-end="url(#a)"/>
  <path class="l" d="M680 205H740" marker-end="url(#a)"/>
  <path class="l" d="M835 245V290" marker-end="url(#a)"/>
  <path class="l d" d="M585 290V320" marker-end="url(#a)"/>
  <path class="l d" d="M490 350C330 350 330 280 345 262" marker-end="url(#a)"/>
  <text class="s" x="215" y="196">POST /api/chat</text>
  <text class="s" x="215" y="224" fill="#22d3ee">events ←</text>
  <text class="s" x="370" y="338">POST /api/approvals/:id</text>
</svg>
