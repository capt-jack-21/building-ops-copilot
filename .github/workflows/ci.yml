name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        # No API key is configured in CI: every test runs against the demo model, so CI costs nothing.

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t building-ops-copilot .
      - name: Container answers its health check
        run: |
          docker run -d --name copilot -p 3000:3000 -e DEMO_MODE=1 building-ops-copilot
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs copilot
          exit 1
